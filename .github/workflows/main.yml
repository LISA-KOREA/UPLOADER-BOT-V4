name: Auto-Reply Bot

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest

    steps:
      - name: Post a welcome comment
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const payload = context.payload;

            // Don't reply to bot comments
            if (payload.comment?.user?.type === "Bot") {
              console.log("Skipping bot comment.");
              return;
            }

            let issueNumber = null;
            let message = "";

            // New issue
            if (context.eventName === "issues") {
              issueNumber = payload.issue.number;
              message = "🎉 Thanks for opening an issue! Our team will review it soon.";
            }

            // New pull request
            else if (context.eventName === "pull_request") {
              issueNumber = payload.pull_request.number;
              message = "🚀 Thanks for your pull request! We'll review and merge if everything looks good.";
            }

            // New issue/PR comment
            else if (context.eventName === "issue_comment") {
              issueNumber = payload.issue.number;
              message = "💬 Thanks for your comment! We'll take it into account.";
            }

            if (!issueNumber) {
              console.log("⚠️ No valid issue or pull request number found.");
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: message
            });

            console.log(`✅ Comment added to #${issueNumber}`);
